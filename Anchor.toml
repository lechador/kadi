# No [toolchain] section on purpose: pinning anchor_version makes the CLI try to
# resolve and install a matching Solana release on every command, which fights
# the platform-tools version this workspace actually builds against. See
# scripts/build-program.sh.

[features]
resolution = true
skip-lint = false

[programs.localnet]
kadi = "GusBZT1xMiapNKnen2t67D86QcfQtGfyZvgRmR8hHKvR"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
