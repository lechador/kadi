[package]
name = "kadi"
version = "0.1.0"
description = "Non-custodial creator donations on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kadi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
